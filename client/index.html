<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="EngineerSpace" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://jvm-crew.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://jvm-crew.onrender.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          var backendHost = isLocal ? '' : 'https://jvm-crew.onrender.com';
          // Pre-warm backend TCP connection, DNS, and container immediately on page load
          fetch(backendHost + '/health', { method: 'GET', mode: 'cors', keepalive: true }).catch(function() {});
          fetch(backendHost + '/api/health', { method: 'GET', mode: 'cors', keepalive: true }).catch(function() {});
          fetch(backendHost + '/api/readiness', { method: 'GET', mode: 'cors', keepalive: true }).catch(function() {});
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased selection:bg-accent-subtle selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
