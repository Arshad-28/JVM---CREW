server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/xml

spring:
  application:
    name: jvmcrew-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jvmcrew}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:jvmcrew}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:jvmcrew_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: JvmCrewHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 8000
      validation-timeout: 2500
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

app:
  storage:
    provider: ${STORAGE_PROVIDER:auto}
  audio:
    upload-dir: ${APP_AUDIO_UPLOAD_DIR:uploads/audio}
  supabase:
    url: ${SUPABASE_URL:${SUPABASE_PROJECT_URL:https://flvddrrjeydnkmyeqiqn.supabase.co}}
    key: ${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_KEY:${SUPABASE_ANON_KEY:}}}
    jwt-secret: ${SUPABASE_JWT_SECRET:${JWT_SECRET:}}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}
    jwks-url: ${SUPABASE_JWKS_URL:${app.supabase.url}/auth/v1/.well-known/jwks.json}
    bucket: ${SUPABASE_STORAGE_BUCKET:jvmcrew-files}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:80,http://localhost:5173,https://engineerspace.netlify.app}}
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
  mail:
    from: ${APP_MAIL_FROM:${MAIL_FROM:noreply@engineerspace.app}}
  keep-alive:
    enabled: ${APP_KEEP_ALIVE_ENABLED:true}
    url: ${APP_KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:https://jvm-crew.onrender.com}}


ai:
  provider: ${AI_PROVIDER:gemini}
  api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
  model: ${AI_MODEL:gemini-3.6-flash}
  base-url: ${AI_BASE_URL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}


