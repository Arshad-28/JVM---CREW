server:
  port: 8080

spring:
  application:
    name: jvmcrew-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jvmcrew}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:jvmcrew}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:jvmcrew_password}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

app:
  audio:
    upload-dir: ${APP_AUDIO_UPLOAD_DIR:uploads/audio}

ai:
  provider: ${AI_PROVIDER:gemini}
  api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
  model: ${AI_MODEL:gemini-3.6-flash}
  base-url: ${AI_BASE_URL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

