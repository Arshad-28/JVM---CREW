spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jvmcrew}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:jvmcrew}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: JvmCrewHikariDevPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 8000
      validation-timeout: 2500
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 45000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
